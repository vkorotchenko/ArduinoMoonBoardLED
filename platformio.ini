; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
; Serial monitor baud — must match Serial.begin() in main.cpp.
monitor_speed = 9600
; Port the Nano 33 IoT enumerates as on macOS (glob avoids the Bluetooth/audio
; ports). On Linux use /dev/ttyACM*; on Windows use the COMx number.
monitor_port = /dev/cu.usbmodem*
upload_port = /dev/cu.usbmodem*
; Timestamp each log line in the monitor (pairs with the [mem]/[beat] logging).
monitor_filters = time
lib_deps =
	makuna/NeoPixelBus@^2.6.3
	arduino-libraries/ArduinoBLE@^1.3.7
	adafruit/Adafruit SleepyDog Library@^1.6.5
	cmaglie/FlashStorage@^1.0.0

