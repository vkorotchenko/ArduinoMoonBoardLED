; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; --- Arduino Nano 33 IoT (original board, ArduinoBLE + NINA radio) ---
[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
; Compile only the Nano sketch for this board
build_src_filter = +<*> -<main_esp32.cpp>
lib_deps =
	https://github.com/FabianRig/ArduinoMultiUserHardwareBLESerial
	makuna/NeoPixelBus@^2.6.3
	arduino-libraries/ArduinoBLE@1.3.6

; --- Adafruit Feather ESP32 V2 (on-die BLE via the built-in BLEDevice library) ---
[env:featheresp32v2]
platform = espressif32@^6.5.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
; Compile only the ESP32 sketch for this board (BLEDevice ships with the ESP32 core)
build_src_filter = +<*> -<main.cpp>
lib_deps =
	makuna/NeoPixelBus@^2.7.3

